name: Release build

# A v* tag (v1.0.0) publishes that release: built from the tag exactly as F-Droid builds it, then signed. F-Droid
# checks its own build against this APK and, when they match, publishes this signed copy.
# Before the first release tag, merges to main publish prereleases 0.9.N (N = commits on main, versionCode 900000 + N).
# After it, every merge to main publishes a development build as a prerelease, numbered from the last release:
# 1.0.0.K with versionCode = 1.0.0's code + K, where K counts the commits since the v1.0.0 tag. It always sorts
# after the release it follows and before the next one, so installed copies update either way.
# Needs the signing secrets; until they exist this skips without failing.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # the signing secrets keep the names they were saved under before the rename
      HAS_KEY: ${{ secrets.DIVVYWOOD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check for the signing key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::The signing secrets aren't set yet, so no release was published."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
      - name: Work out the version
        if: env.HAS_KEY == 'true'
        id: v
        run: |
          src_name=$(sed -n 's/.*DIVVYRUNE_VERSION_NAME") ?: "\(.*\)"/\1/p' app/build.gradle.kts)
          src_code=$(sed -n 's/.*DIVVYRUNE_VERSION_CODE")?.toInt() ?: \([0-9_]*\)/\1/p' app/build.gradle.kts | tr -d _)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$src_name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $src_name in app/build.gradle.kts"; exit 1
            fi
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "name=$src_name" >> "$GITHUB_OUTPUT"
            echo "code=$src_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            # before the first release: 0.9.N, N = commits on main; above the old Build N codes, below 1.0.0
            n=$(git rev-list --count HEAD)
            echo "kind=dev" >> "$GITHUB_OUTPUT"
            echo "name=0.9.$n" >> "$GITHUB_OUTPUT"
            echo "code=$((900000 + n))" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=${last#v}
          IFS=. read -r major minor patch <<< "$base"
          k=$(git rev-list --count "$last"..HEAD)
          if [ "$k" -gt 99 ]; then echo "::error::$k commits since $last; release a new version first."; exit 1; fi
          echo "kind=dev" >> "$GITHUB_OUTPUT"
          echo "name=$base.$k" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 10000 + patch * 100 + k))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true' && steps.v.outputs.kind != 'none'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true' && steps.v.outputs.kind != 'none'
      - name: Build the signed APK
        if: env.HAS_KEY == 'true' && steps.v.outputs.kind != 'none'
        env:
          KEYSTORE_BASE64: ${{ secrets.DIVVYWOOD_KEYSTORE_BASE64 }}
          DIVVYRUNE_KEYSTORE_PASSWORD: ${{ secrets.DIVVYWOOD_KEYSTORE_PASSWORD }}
          DIVVYRUNE_KEY_ALIAS: ${{ secrets.DIVVYWOOD_KEY_ALIAS }}
          DIVVYRUNE_KEY_PASSWORD: ${{ secrets.DIVVYWOOD_KEY_PASSWORD }}
          KIND: ${{ steps.v.outputs.kind }}
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/divvyrune.jks"
          # a release builds from the source's own version, exactly as F-Droid does
          if [ "$KIND" = dev ]; then export DIVVYRUNE_VERSION_NAME="$NAME" DIVVYRUNE_VERSION_CODE="$CODE"; fi
          DIVVYRUNE_KEYSTORE="$RUNNER_TEMP/divvyrune.jks" ./gradlew --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/divvyrune.jks"
          cp app/build/outputs/apk/release/app-release.apk "divvyrune-$NAME.apk"
      - name: Publish
        if: env.HAS_KEY == 'true' && steps.v.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.v.outputs.kind }}
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          if [ "$KIND" = release ]; then
            notes=fastlane/metadata/android/en-US/changelogs/$CODE.txt
            gh release create "v$NAME" "divvyrune-$NAME.apk" --verify-tag --latest \
              --title "Divvyrune $NAME" --notes-file "$notes"
          else
            gh release create "dev-$NAME" "divvyrune-$NAME.apk" --prerelease --latest=false \
              --title "Development build $NAME" \
              --notes "Development build of ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
              --target "$GITHUB_SHA"
          fi
